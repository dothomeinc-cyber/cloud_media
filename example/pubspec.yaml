name: cloud_media_example
description: Example app for the cloud_media package.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_media:
    path: ../
  firebase_core: ^4.10.0
  flutter_riverpod: ^3.3.2-dev.2
  flutter_screenutil: ^5.9.3
  permission_handler_package: ^1.0.5
  riverpod_offline_sync: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
