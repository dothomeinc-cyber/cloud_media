name: cloud_media
description: A complete Firebase-native media management Flutter package. One line to pick. Everything else automated.
version: 1.0.2
homepage: https://github.com/yourusername/cloud_media
repository: https://github.com/yourusername/cloud_media

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  firebase_storage: ^13.4.2
  cloud_firestore: ^6.5.0

  # Media
  image_picker: ^1.1.2
  file_picker: ^12.0.0-beta.5
  video_player: ^2.9.2
  audioplayers: ^6.1.0

  # Image processing
  flutter_image_compress: ^2.3.0
  image: ^4.2.0

  # Background removal
  image_background_remover: ^2.0.0

  # Video thumbnail
  flutter_video_thumbnail_plus: ^1.0.6

  # UI
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1

  # Offline sync
  riverpod_offline_sync: ^1.0.6
  hive_flutter: ^1.1.0
  synchronized: ^3.1.0

  # Storage / Path
  path_provider: ^2.1.4
  path: ^1.9.0

  # Connectivity
  connectivity_plus: ^7.1.1

  # Permissions
  permission_handler_package: ^2.0.2

  # Utilities
  uuid: ^4.5.1
  mime: ^2.0.0
  share_plus: ^13.1.0
  intl: ^0.20.2
  cross_file: ^0.3.4+2

  # State management
  flutter_riverpod: ^3.3.2-dev.2
  flutter_screenutil: ^5.9.3
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  assets:
    - assets/icons/

  # NOTE: cloud_media is a pure-Dart package. It has no native Android/iOS
  # implementation of its own — all platform work is delegated to its
  # dependencies (image_picker, file_picker, firebase_storage, video_player,
  # etc.), each of which already registers its own native plugin code.
  #
  # The `plugin:` block below was removed because it declared a
  # `CloudMediaPlugin` native class (Android/iOS) that doesn't exist in this
  # package's source tree. Flutter's plugin registrant then tried to locate
  # and register that nonexistent class during every consuming app's build,
  # causing:
  #   "The plugin `cloud_media` doesn't have a main class defined in ..."
  #
  # Unless cloud_media later adds genuine native platform code (a real
  # CloudMediaPlugin.kt / .swift file implementing a MethodChannel), this
  # package should stay plugin-block-free and rely entirely on Dart-level
  # composition of its dependencies.
